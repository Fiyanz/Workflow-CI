name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/red-chili-pepper-pests-classifier

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin TensorFlow to a version compatible with MLflow autologging
          pip install mlflow==2.19.0 'tensorflow==2.18.0' tensorboard scikit-learn numpy matplotlib seaborn

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Train with MLflow and build Docker image
        env:
          # reduce TF info/warnings (including AVX2 messages) in CI logs
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          # Runner uses pip-installed environment; avoid MLflow creating/activating conda env
          # Pass an absolute dataset path so MLflow run (which may copy the project)
          # can access the dataset reliably.
          mlflow run MLproject --env-manager local --experiment-name red_chili_pepper_pests_ci \
            -P dataset-dir=${{ github.workspace }}/RedChiliPepperPestsDataset \
            -P epochs=1 \
            -P batch_size=32
          MODEL_PATH=$(find mlruns -name "*.keras" -type f | head -1 | xargs dirname)
          echo "MODEL_PATH=$MODEL_PATH"
          cp -r "$MODEL_PATH" MLproject/model
          cd MLproject
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} -t ${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          echo "Docker image pushed: ${{ env.DOCKER_IMAGE_NAME }}:latest"
