name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/red-chili-pepper-pests-classifier

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install MLflow
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0

      - name: Download dataset
        run: |
          pip install kaggle
          mkdir -p ~/.kaggle
          echo '${{ secrets.KAGGLE_JSON }}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle datasets download -d indraagustian/red-chili-pepper-pests-dataset -p ./dataset --unzip

      - name: Install dependencies
        run: |
          pip install tensorflow==2.18.0 tensorboard scikit-learn numpy matplotlib seaborn

      - name: Train and build Docker image
        run: |
          cd MLproject
          python modelling.py --dataset-dir ../dataset --epochs 1 --batch_size 256
          mkdir -p model
          find . -name "*.keras" -exec cp {} model/ \;
          ls -la model/
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} -t ${{ env.DOCKER_IMAGE_NAME }}:latest .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          echo "Docker image pushed: ${{ env.DOCKER_IMAGE_NAME }}:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
